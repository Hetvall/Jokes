<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Chiste random!</title>
    <link rel="stylesheet" href="style.css">
    <script src="./dist/index.js" defer></script>
</head>

<body>
    <header>
        <h1>Chistes al azar!</h1>
    </header>
    <div class="content">

        <div class="joke">
            <div class="show__setUp__joke"></div>
            <div class="show__delivery__joke"></div>
            <div class="show__single__joke"></div>
        </div>
        <div class="buttons">
            <button id="btnJoke" name="btnJoke" class="button button-info"">
                Dame un chiste!
            </button>
            <button id=" btnDetail" name="btnDetail" class="button button-details">
                Remate
            </button>
            <button id=" btnReset" name="btnReset" class="button button-warning" onclick="window.location.reload();">
                Reinicio
            </button>
        </div>
    </div>
</body>

</html>
